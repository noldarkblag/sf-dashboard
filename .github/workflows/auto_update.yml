name: Auto Fetch Google Sheet to Rawdata JSON

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# Binibigyan ng permiso ang bot para makapag-commit/push ng rawdata.json
permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run generate_json.py
        run: python generate_json.py

      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rawdata.json
          git commit -m "Auto-update rawdata.json mula sa Google Sheet" || exit 0
          git push
