name: Auto Update Rawdata JSON

on:
  schedule:
    # Araw-araw mag-a-update tuwing 12:00 AM UTC (Palitan ang schedule ayon sa gusto mo)
    - cron: '0 0 * * *'
  workflow_dispatch: # Pinapayagan kang i-trigger ito nang manual sa GitHub button

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Script to Generate JSON
        run: python generate_json.py

      - name: Commit and Push Changes back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rawdata.json
          git commit -m "Auto-update rawdata.json mula sa Google Sheet" || exit 0
          git push
